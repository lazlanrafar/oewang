name: oewang
description: "Oewang mobile — Financial OS"
publish_to: 'none'
# The store build number is +N plus the release workflow's run number
# (docs/deployment.md#mobile). Raise the name for a new version; never lower +N.
version: 2.0.0+7

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  decimal: ^3.2.1
  dio: ^5.7.0
  equatable: ^2.0.7
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: 10.3.1
  flutter_svg: ^2.0.10+1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.1
  sentry_flutter: ^8.14.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_native_splash: ^2.4.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

  # Configuration comes from --dart-define-from-file=env/<name>.json, never
  # from a bundled asset (docs/features/mobile.md#configuration).
  assets:
    - assets/icons/

flutter_native_splash:
  color: "#000000"
  image: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  color_dark: "#000000"
  image_dark: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  android_12:
    color: "#000000"
    image: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
    color_dark: "#000000"
    image_dark: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  android: true
  ios: true
  web: false
