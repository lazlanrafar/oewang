<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- The old app's icons: the mark on a white rounded square as SVG, the
		     same at 16 and 32 px for browsers that want an .ico, and the
		     website's touch icon for a home screen. -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
		<!--
			The theme, applied before paint, so a dark-mode user never sees a
			white flash on load.

			It lives here rather than in `<ModeWatcher />` because only this
			file can carry `%sveltekit.nonce%`, which SvelteKit replaces per
			response with the nonce it also puts in `script-src`. The
			component injects its own copy through `{@html}` with no nonce
			and an unquoted attribute, so under this app's policy that copy
			is refused by the browser and the flash comes back. The layout
			therefore renders it with `disableHeadScriptInjection`, which is
			the option the library documents for exactly this.

			The two keys and the class name are mode-watcher's defaults. If
			either is ever overridden on the component, it has to change here
			too (SEC-15, D64).
		-->
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var mode = localStorage.getItem('mode-watcher-mode') || 'light';
					var dark =
						mode === 'dark' ||
						(mode === 'system' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (error) {
					// Storage throws in a private window. The page then renders
					// in the default mode, which is a worse first paint and not
					// a broken one.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- `contents` rather than an inline style, so the policy needs no
		     exception for this file (SEC-15). -->
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
